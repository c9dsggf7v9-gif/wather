<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天氣與日出日落</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: #f1f4f8;
            color: #263445;
            min-height: 100vh;
            padding: 35px 20px;
        }

        .container {
            max-width: 1050px;
            margin: auto;
        }

        /* 頁面標題 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 26px;
            color: #25364a;
        }

        header p {
            color: #8391a3;
            font-size: 13px;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, button {
            padding: 11px 16px;
            border-radius: 9px;
            border: 1px solid #dce2ea;
            font-size: 14px;
            cursor: pointer;
            background: white;
            color: #34465c;
        }

        button {
            background: #344e70;
            color: white;
            border: none;
            transition: 0.2s;
        }

        button:hover {
            background: #233b59;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 目前天氣 */
        .current-weather {
            background: linear-gradient(135deg, #263f60, #172a43);
            color: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(30, 50, 80, 0.15);
            margin-bottom: 30px;
        }

        .current-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .location-name {
            font-size: 19px;
            color: #d3dfed;
        }

        .current-date {
            color: #a9bbd0;
            font-size: 13px;
            margin-top: 7px;
        }

        .temperature-area {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 28px;
        }

        .temperature {
            font-size: 76px;
            font-weight: 600;
            line-height: 1.1;
        }

        .weather-icon {
            font-size: 65px;
        }

        .weather-description {
            font-size: 20px;
            color: #e4edf8;
            margin-top: 8px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 35px;
            border-top: 1px solid rgba(255,255,255,0.17);
            padding-top: 25px;
        }

        .detail-item {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 17px;
        }

        .detail-label {
            font-size: 13px;
            color: #b9c9dc;
            margin-bottom: 9px;
        }

        .detail-value {
            font-size: 21px;
            font-weight: 600;
        }

        /* 三日預報 */
        .section-title {
            font-size: 21px;
            margin-bottom: 18px;
            color: #293d54;
        }

        .forecast-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .forecast-card {
            background: white;
            padding: 23px 20px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(40, 60, 90, 0.05);
            transition: transform 0.2s;
        }

        .forecast-card:hover {
            transform: translateY(-4px);
        }

        .forecast-date {
            font-size: 16px;
            font-weight: 600;
            color: #344c68;
        }

        .forecast-icon {
            font-size: 48px;
            text-align: center;
            margin: 20px 0 8px;
        }

        .forecast-weather {
            text-align: center;
            font-size: 15px;
            color: #6e7e90;
            margin-bottom: 15px;
        }

        .forecast-temp {
            text-align: center;
            font-size: 23px;
            font-weight: 600;
            color: #344c68;
            margin-bottom: 22px;
        }

        .forecast-temp span {
            color: #9ba7b5;
            font-size: 15px;
            margin: 0 5px;
        }

        .forecast-info {
            border-top: 1px solid #edf0f4;
            padding-top: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding: 9px 0;
            gap: 8px;
        }

        .info-label {
            color: #8290a0;
        }

        .info-value {
            color: #40546b;
            font-weight: 600;
            text-align: right;
        }

        /* 降雨提醒 */
        .rain-alert {
            display: none;
            background: #fff3df;
            color: #a76516;
            border: 1px solid #f5d9a8;
            padding: 15px 20px;
            border-radius: 12px;
            margin-top: 22px;
            font-weight: 600;
        }

        /* 載入與錯誤 */
        .loading {
            text-align: center;
            padding: 35px;
            color: #66798e;
            background: white;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .error {
            display: none;
            background: #feecec;
            color: #c62828;
            border: 1px solid #f2baba;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .hidden {
            display: none !important;
        }

        /* 頁尾 */
        footer {
            text-align: center;
            color: #8996a5;
            font-size: 12px;
            line-height: 1.8;
            margin-top: 40px;
        }

        footer a {
            color: #536f91;
        }

        /* RWD */
        @media (max-width: 700px) {
            body {
                padding: 20px 14px;
            }

            header {
                align-items: flex-start;
            }

            header h1 {
                font-size: 22px;
            }

            .controls {
                width: 100%;
            }

            select {
                flex: 1;
            }

            .current-weather {
                padding: 25px 20px;
            }

            .temperature {
                font-size: 60px;
            }

            .weather-icon {
                font-size: 50px;
            }

            .weather-details {
                gap: 8px;
            }

            .detail-item {
                padding: 12px 9px;
            }

            .detail-value {
                font-size: 16px;
            }

            .forecast-cards {
                grid-template-columns: 1fr;
            }

            .forecast-card {
                padding: 20px;
            }
        }

        @media (max-width: 380px) {
            .weather-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 標題與地點選擇 -->
    <header>
        <div>
            <h1>🌤️ 天氣與日出日落</h1>
            <p>即時天氣資訊與未來三日預報</p>
        </div>

        <div class="controls">
            <select id="locationSelect">
                <option value="taipei">臺北市</option>
                <option value="hsinchu">新竹市</option>
                <option value="taichung" selected>臺中市</option>
                <option value="kaohsiung">高雄市</option>
            </select>

            <button id="refreshBtn" onclick="loadWeather()">
                ↻ 重新整理
            </button>
        </div>
    </header>

    <!-- 載入訊息 -->
    <div id="loading" class="loading">
        ⏳ 資料載入中，請稍候...
    </div>

    <!-- 錯誤訊息 -->
    <div id="error" class="error"></div>

    <!-- 天氣內容 -->
    <main id="weatherContent" class="hidden">

        <!-- 目前天氣 -->
        <section class="current-weather">

            <div class="current-top">
                <div>
                    <div class="location-name" id="currentLocation">
                        臺中市
                    </div>
                    <div class="current-date" id="currentDate"></div>
                </div>
            </div>

            <div class="temperature-area">
                <div class="weather-icon" id="currentIcon">☀️</div>

                <div>
                    <div class="temperature">
                        <span id="currentTemp">--</span>°
                    </div>
                    <div class="weather-description" id="currentWeather">
                        載入中
                    </div>
                </div>
            </div>

            <!-- 體感溫度、濕度、風速 -->
            <div class="weather-details">

                <div class="detail-item">
                    <div class="detail-label">🌡️ 體感溫度</div>
                    <div class="detail-value">
                        <span id="feelsLike">--</span> °C
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-label">💧 相對濕度</div>
                    <div class="detail-value">
                        <span id="humidity">--</span> %
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-label">💨 風速</div>
                    <div class="detail-value">
                        <span id="windSpeed">--</span>
                        <small style="font-size:12px">km/h</small>
                    </div>
                </div>

            </div>
        </section>

        <!-- 未來三天天氣 -->
        <section>
            <h2 class="section-title">📅 未來三天天氣預報</h2>

            <div class="forecast-cards" id="forecastCards">
            </div>

            <!-- 降雨提醒 -->
            <div id="rainAlert" class="rain-alert">
                ☔ 未來三天有降雨機率達 40% 以上的日期，記得帶傘！
            </div>
        </section>

    </main>

    <!-- 頁尾 -->
    <footer>
        <p>
            資料來源：
            <a href="https://open-meteo.com/" target="_blank" rel="noopener">
                Open-Meteo
            </a>
            （CC BY 4.0）
        </p>
        <p>
            本網站資料僅供參考，並非中央氣象署的官方天氣預報。
        </p>
    </footer>

</div>

<script>
    // =====================================
    // 1. 地點經緯度設定
    // =====================================

    const locations = {
        taipei: {
            name: "臺北市",
            latitude: 25.0330,
            longitude: 121.5654
        },
        hsinchu: {
            name: "新竹市",
            latitude: 24.8138,
            longitude: 120.9675
        },
        taichung: {
            name: "臺中市",
            latitude: 24.1477,
            longitude: 120.6736
        },
        kaohsiung: {
            name: "高雄市",
            latitude: 22.6273,
            longitude: 120.3014
        }
    };


    // =====================================
    // 2. WMO 天氣代碼轉換函式
    // =====================================

    function getWeatherInfo(code) {

        if (code === 0) {
            return { text: "晴天", icon: "☀️" };
        }

        if (code === 1) {
            return { text: "大致晴朗", icon: "🌤️" };
        }

        if (code === 2) {
            return { text: "局部多雲", icon: "⛅" };
        }

        if (code === 3) {
            return { text: "陰天", icon: "☁️" };
        }

        if (code === 45 || code === 48) {
            return { text: "有霧", icon: "🌫️" };
        }

        if (code >= 51 && code <= 57) {
            return { text: "毛毛雨", icon: "🌦️" };
        }

        if (code >= 61 && code <= 67) {
            return { text: "下雨", icon: "🌧️" };
        }

        if (code >= 71 && code <= 77) {
            return { text: "下雪", icon: "❄️" };
        }

        if (code >= 80 && code <= 82) {
            return { text: "陣雨", icon: "🌦️" };
        }

        if (code >= 95) {
            return { text: "雷雨", icon: "⛈️" };
        }

        return { text: "天氣資訊不明", icon: "🌡️" };
    }


    // =====================================
    // 3. 日期格式化
    // =====================================

    function formatDate(dateString) {

        const date = new Date(dateString + "T00:00:00");

        const month = date.getMonth() + 1;
        const day = date.getDate();

        const weekdays = [
            "星期日", "星期一", "星期二",
            "星期三", "星期四", "星期五", "星期六"
        ];

        return `${month}/${day} ${weekdays[date.getDay()]}`;
    }


    // =====================================
    // 4. 時間格式化，只取 HH:MM
    // =====================================

    function formatTime(timeString) {

        if (!timeString) {
            return "--:--";
        }

        return timeString.split("T")[1]?.substring(0, 5) || "--:--";
    }


    // =====================================
    // 5. 取得天氣資料
    // =====================================

    let requestId = 0;

    async function loadWeather() {

        const currentRequest = ++requestId;

        const select = document.getElementById("locationSelect");
        const location = locations[select.value];

        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const content = document.getElementById("weatherContent");
        const refreshBtn = document.getElementById("refreshBtn");

        // 顯示載入狀態
        loading.classList.remove("hidden");
        error.style.display = "none";
        content.classList.add("hidden");
        refreshBtn.disabled = true;

        try {

            // 組合 API 網址
            const url = new URL(
                "https://api.open-meteo.com/v1/forecast"
            );

            url.search = new URLSearchParams({
                latitude: location.latitude,
                longitude: location.longitude,

                current: [
                    "temperature_2m",
                    "apparent_temperature",
                    "relative_humidity_2m",
                    "weather_code",
                    "wind_speed_10m"
                ].join(","),

                daily: [
                    "weather_code",
                    "temperature_2m_max",
                    "temperature_2m_min",
                    "precipitation_probability_max",
                    "uv_index_max",
                    "sunrise",
                    "sunset"
                ].join(","),

                timezone: "Asia/Taipei",
                forecast_days: 3
            }).toString();

            // fetch 搭配 async/await 呼叫 API
            const response = await fetch(url);

            // 檢查 HTTP 狀態
            if (!response.ok) {
                throw new Error(
                    `伺服器回應錯誤：HTTP ${response.status}`
                );
            }

            // 將回傳資料轉成 JSON
            const data = await response.json();

            if (data.error) {
                throw new Error(data.reason || "API 資料錯誤");
            }

            // 避免較舊的請求覆蓋最新地點
            if (currentRequest !== requestId) {
                return;
            }

            // 顯示目前天氣
            displayCurrentWeather(data.current, location);

            // 顯示未來三天
            displayForecast(data.daily);

            // 隱藏載入畫面，顯示天氣
            loading.classList.add("hidden");
            content.classList.remove("hidden");

        } catch (err) {

            if (currentRequest !== requestId) {
                return;
            }

            loading.classList.add("hidden");
            content.classList.add("hidden");

            error.textContent =
                "❌ 天氣資料載入失敗：" + err.message +
                "，請檢查網路連線後重新整理。";

            error.style.display = "block";

            console.error("天氣 API 錯誤：", err);

        } finally {

            if (currentRequest === requestId) {
                refreshBtn.disabled = false;
            }
        }
    }


    // =====================================
    // 6. 顯示目前天氣
    // =====================================

    function displayCurrentWeather(current, location) {

        const weather = getWeatherInfo(current.weather_code);

        document.getElementById("currentLocation").textContent =
            location.name;

        document.getElementById("currentDate").textContent =
            "資料更新時間：" +
            current.time.replace("T", " ");

        document.getElementById("currentTemp").textContent =
            Math.round(current.temperature_2m);

        document.getElementById("currentIcon").textContent =
            weather.icon;

        document.getElementById("currentWeather").textContent =
            weather.text;

        document.getElementById("feelsLike").textContent =
            Math.round(current.apparent_temperature);

        document.getElementById("humidity").textContent =
            current.relative_humidity_2m;

        document.getElementById("windSpeed").textContent =
            current.wind_speed_10m;
    }


    // =====================================
    // 7. 顯示未來三天天氣
    // =====================================

    function displayForecast(daily) {

        const forecastCards =
            document.getElementById("forecastCards");

        const rainAlert =
            document.getElementById("rainAlert");

        forecastCards.innerHTML = "";

        // 判斷未來三天是否有降雨機率達 40%
        const hasRain = daily.precipitation_probability_max.some(
            probability => probability >= 40
        );

        rainAlert.style.display = hasRain ? "block" : "none";

        // 逐日產生三張天氣卡片
        for (let i = 0; i < 3; i++) {

            const weather = getWeatherInfo(daily.weather_code[i]);

            const date = formatDate(daily.time[i]);

            const minTemp = Math.round(
                daily.temperature_2m_min[i]
            );

            const maxTemp = Math.round(
                daily.temperature_2m_max[i]
            );

            const rain = daily.precipitation_probability_max[i];

            const uv = daily.uv_index_max[i];

            const sunrise = formatTime(daily.sunrise[i]);

            const sunset = formatTime(daily.sunset[i]);

            // 建立天氣卡片
            const card = document.createElement("div");

            card.className = "forecast-card";

            card.innerHTML = `
                <div class="forecast-date">${date}</div>

                <div class="forecast-icon">${weather.icon}</div>

                <div class="forecast-weather">${weather.text}</div>

                <div class="forecast-temp">
                    ${minTemp}°
                    <span>—</span>
                    ${maxTemp}°C
                </div>

                <div class="forecast-info">

                    <div class="info-row">
                        <span class="info-label">🌧️ 降雨機率</span>
                        <span class="info-value">${rain ?? "--"}%</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">☀️ 紫外線指數</span>
                        <span class="info-value">${uv?.toFixed(1) ?? "--"}</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">🌅 日出時間</span>
                        <span class="info-value">${sunrise}</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">🌇 日落時間</span>
                        <span class="info-value">${sunset}</span>
                    </div>

                </div>
            `;

            forecastCards.appendChild(card);
        }
    }


    // =====================================
    // 8. 地點切換時自動重新取得資料
    // =====================================

    document.getElementById("locationSelect")
        .addEventListener("change", loadWeather);


    // =====================================
    // 9. 網頁載入時自動取得天氣資料
    // =====================================

    loadWeather();

</script>

</body>
</html>
